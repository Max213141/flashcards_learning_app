name: flashcards_learning_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# RULES OF TRANSLATION
# Translation to our native language IS  translation field
# Word in foreign laguage IS  word field

version: 1.0.0+5

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_svg: ^2.0.10
  lottie: ^3.3.2
  drift: ^2.20.0
  drift_flutter: ^0.3.0
  path: ^1.9.0
  path_provider: ^2.1.4
  file_picker: ^10.3.10
  cupertino_icons: ^1.0.8
  auto_route: ^11.1.0
  flutter_slidable: ^4.0.3
  flutter_card_swiper: ^7.2.0
  freezed_annotation: ^3.1.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  shared_preferences: ^2.5.3
  firebase_core: ^4.5.0
  firebase_crashlytics: ^5.0.8
  firebase_analytics: ^12.0.4
  flutter_gemma: ^0.16.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.2
  auto_route_generator: ^10.4.0
  build_runner: ^2.5.4
  freezed: ^3.2.3
  drift_dev: ^2.20.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/iconss/launcher_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/iconss/launcher_icon_adaptive_foreground.png"
  min_sdk_android: 21

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/iconss/
    - assets/default_topics/
    - assets/splash_flashcards.lottie
    - assets/checkhappy.lottie
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Jost
      fonts:
        - asset: fonts/Jost-Light.ttf
          weight: 300
        - asset: fonts/Jost-Regular.ttf
          weight: 400
        - asset: fonts/Jost-SemiBold.ttf
          weight: 600
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
